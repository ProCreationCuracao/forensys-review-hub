<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1b1b20">
<title>ForenSys Dispatch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
:root{--red:#c11f30;--red2:#e5394a;--ink:#16161a;--muted:#6c6c75;--line:#e7e7ec;--bg:#f4f4f6;--green:#16a34a;--amber:#d97706;--blue:#2563eb;--dark:#1b1b20}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,system-ui,sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button{font:inherit;cursor:pointer}
.app{display:grid;grid-template-rows:58px 1fr;height:100vh}
header{display:flex;align-items:center;gap:16px;padding:0 18px;background:var(--dark);color:#fff}
header img{height:30px;background:#fff;border-radius:6px;padding:3px 8px}
header h1{font-size:15px;letter-spacing:.18em;font-weight:700;margin:0}
.demo{font-size:11px;font-weight:700;background:#f59e0b;color:#111;padding:3px 8px;border-radius:999px;letter-spacing:.05em}
.stats{display:flex;gap:10px;margin-left:auto}
.stat{background:rgba(255,255,255,.07);border:1px solid rgba(255,255,255,.1);border-radius:10px;padding:5px 12px;font-size:12px;display:flex;gap:8px;align-items:center}
.stat b{font-size:16px}.dot{width:9px;height:9px;border-radius:50%}
.clock{font-variant-numeric:tabular-nums;font-size:14px;font-weight:600;margin-left:8px;opacity:.85}
.btn{border:0;border-radius:10px;padding:9px 14px;font-weight:700;font-size:13px}
.btn.red{background:linear-gradient(145deg,var(--red2),var(--red));color:#fff;box-shadow:0 6px 16px rgba(193,31,48,.35)}
.btn.ghost{background:#f1f1f4;color:var(--ink)}
.btn.sm{padding:6px 10px;font-size:12px;border-radius:8px}
main{display:grid;grid-template-columns:360px 1fr 330px;min-height:0}
.col{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.col.right{border-right:0;border-left:1px solid var(--line)}
.colh{padding:14px 16px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--line)}
.colh h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;margin:0;color:var(--muted)}
.colh .count{background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:700;padding:2px 8px}
.list{overflow:auto;flex:1;padding:10px}
.inc{border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:9px;cursor:pointer;transition:.15s;position:relative}
.inc:hover{border-color:#e7b9c1;box-shadow:0 6px 16px rgba(0,0,0,.05)}
.inc.sel{border-color:var(--red);box-shadow:0 0 0 3px rgba(193,31,48,.12)}
.inc .top{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted)}
.inc .no{font-weight:800;color:var(--ink);font-size:13px}
.inc .loc{font-weight:600;margin:6px 0 4px;font-size:14px}
.inc .meta{font-size:12px;color:var(--muted);display:flex;gap:10px;flex-wrap:wrap}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:3px 8px;border-radius:999px}
.p-new{background:#fde8eb;color:var(--red)}.p-disp{background:#fef3c7;color:#92400e}.p-arr{background:#dbeafe;color:#1e40af}.p-polis{background:#ede9fe;color:#5b21b6}.p-closed{background:#dcfce7;color:#166534}
.timer{font-variant-numeric:tabular-nums;font-weight:700}
#map{height:100%;width:100%}
.mapwrap{position:relative;min-height:0}
.maptip{position:absolute;z-index:500;top:14px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:999px;font-size:13px;font-weight:600;box-shadow:0 10px 30px rgba(0,0,0,.25);display:none}
.legend{position:absolute;z-index:500;bottom:14px;left:14px;background:#fff;border-radius:12px;padding:10px 12px;font-size:12px;box-shadow:0 6px 20px rgba(0,0,0,.12);display:flex;gap:12px}
.legend span{display:flex;align-items:center;gap:6px}
.van{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;color:#fff;font-size:11px;font-weight:800;border:3px solid #fff;box-shadow:0 4px 12px rgba(0,0,0,.3)}
.van.free{background:var(--green)}.van.busy{background:var(--amber)}.van.off{background:#9ca3af}
.incpin{width:22px;height:22px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 0 0 0 rgba(193,31,48,.6);animation:ping 1.6s infinite}
@keyframes ping{70%{box-shadow:0 0 0 18px rgba(193,31,48,0)}100%{box-shadow:0 0 0 0 rgba(193,31,48,0)}}
.agent{display:flex;align-items:center;gap:10px;padding:10px;border-radius:10px;cursor:pointer}
.agent:hover{background:#f6f6f8}
.agent .av{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-size:12px;font-weight:800;color:#fff}
.agent .nm{font-weight:600;font-size:13.5px}.agent small{color:var(--muted);font-size:12px;display:block}
.agent .st{margin-left:auto;text-align:right;font-size:11.5px;color:var(--muted)}
.detail{padding:16px;overflow:auto;flex:1}
.detail h3{margin:0 0 4px;font-size:18px}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px;margin:12px 0}
.kv span:nth-child(odd){color:var(--muted)}
.tl{border-left:2px solid var(--line);margin:14px 0 0 6px;padding-left:16px}
.tl div{position:relative;font-size:13px;padding:0 0 12px}
.tl div::before{content:"";position:absolute;left:-23px;top:3px;width:10px;height:10px;border-radius:50%;background:var(--red)}
.tl small{color:var(--muted);display:block;font-size:11.5px}
.sugg{background:#f0fdf4;border:1px solid #bbf7d0;border-radius:12px;padding:12px;margin-top:12px}
.sugg h4{margin:0 0 8px;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:#166534}
.sugg .agent{background:#fff;border:1px solid #dcfce7;margin-bottom:6px}
.actions{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:13px}
.modal{position:fixed;inset:0;background:rgba(10,10,15,.45);display:none;place-items:center;z-index:1000}
.modal.on{display:grid}
.card{background:#fff;border-radius:18px;width:min(520px,94vw);padding:22px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.card h3{margin:0 0 4px}.card p{margin:0 0 14px;color:var(--muted);font-size:13px}
.f{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.f label{font-size:12px;font-weight:600;color:var(--muted);display:flex;flex-direction:column;gap:5px}
.f label.full{grid-column:1/-1}
.f input,.f select,.f textarea{font:inherit;font-size:14px;padding:9px 10px;border:1px solid var(--line);border-radius:10px;color:var(--ink)}
.row{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--dark);color:#fff;padding:10px 16px;border-radius:12px;font-size:13px;font-weight:600;z-index:2000;opacity:0;transition:.3s}
.toast.on{opacity:1}
.tabs{display:none}
@media (max-width:820px){
 .app{grid-template-rows:auto 1fr 62px;height:100dvh}
 header{flex-wrap:wrap;gap:8px;padding:8px 12px;padding-top:max(8px,env(safe-area-inset-top))}
 header img{height:24px}header h1{font-size:12px}.clock{margin-left:auto;font-size:13px}
 .stats{order:3;width:100%;margin:0;overflow-x:auto;gap:6px}
 .stat{padding:4px 9px;font-size:11px;white-space:nowrap}.stat b{font-size:14px}
 #newBtn{position:fixed;right:14px;bottom:calc(78px + env(safe-area-inset-bottom));z-index:900;border-radius:999px;padding:14px 18px;font-size:14px}
 main{display:block;position:relative;min-height:0}
 main>section{position:absolute!important;inset:0}
 main>section:not(.show){display:none!important}
 main>section.col.show{display:flex!important}
 main>section.mapwrap.show{display:block!important}
 .col,.col.right{border:0}
 .legend{bottom:10px;left:10px;right:90px;flex-wrap:wrap;gap:8px;font-size:11px}
 .tabs{display:grid;grid-template-columns:repeat(3,1fr);background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
 .tabs button{border:0;background:none;font-weight:700;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
 .tabs button.on{color:var(--red)}
 .tabs svg{width:22px;height:22px}
 .modal{place-items:end center}
 .card{width:100vw;max-width:100vw;border-radius:18px 18px 0 0;max-height:92dvh;overflow:auto;padding-bottom:max(22px,env(safe-area-inset-bottom))}
 .f{grid-template-columns:1fr}
 .f input,.f select,.f textarea{font-size:16px}
 .maptip{top:10px;font-size:12px;white-space:nowrap}
 .btn.sm{padding:9px 12px;font-size:13px}
}

</style>
</head>
<body>
<div class="app">
  <header>
    <img src="/forensys-logo.png" alt="ForenSys">
    <h1>DISPATCH</h1>
    <span class="demo">DEMO DATA</span>
    <div class="stats">
      <div class="stat"><span class="dot" style="background:var(--red)"></span>Open <b id="sOpen">0</b></div>
      <div class="stat"><span class="dot" style="background:var(--green)"></span>Free <b id="sFree">0</b></div>
      <div class="stat"><span class="dot" style="background:var(--amber)"></span>On job <b id="sBusy">0</b></div>
      <div class="stat">Avg arrival <b id="sAvg">–</b></div>
    </div>
    <button class="btn red" id="newBtn">+ New incident</button>
    <span class="clock" id="clock"></span>
  </header>
  <main>
    <section class="col" id="pInc">
      <div class="colh"><h2>Open incidents</h2><span class="count" id="cOpen">0</span></div>
      <div class="list" id="incList"></div>
    </section>
    <section class="mapwrap show" id="pMap">
      <div id="map"></div>
      <div class="maptip" id="maptip">Click on the map to set the incident location</div>
      <div class="legend"><span><i class="dot" style="background:var(--green)"></i>Free</span><span><i class="dot" style="background:var(--amber)"></i>On job</span><span><i class="dot" style="background:#9ca3af"></i>Checked out</span><span><i class="dot" style="background:var(--red)"></i>Incident</span></div>
    </section>
    <section class="col right" id="pRight">
      <div class="colh"><h2 id="rTitle">Agents</h2></div>
      <div class="detail" id="right"></div>
    </section>
  </main>
  <nav class="tabs">
    <button data-p="pInc"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></svg>Incidents</button>
    <button data-p="pMap" class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12z"/><circle cx="12" cy="10" r="2.6"/></svg>Map</button>
    <button data-p="pRight"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-4 3-6 7-6s7 2 7 6M17 11l2 2 4-4"/></svg><span id="tRight">Agents</span></button>
  </nav>

</div>

<div class="modal" id="modal"><div class="card">
  <h3>New incident</h3><p id="mLoc">Location: click the map</p>
  <div class="f">
    <label>Type<select id="fType"><option>Accident</option><option>Roadside assistance</option></select></label>
    <label>Source of call<select id="fSource"><option>Involved</option><option>Kraan</option><option>Sentral Di Polis</option><option>Unidad</option></select></label>
    <label class="full">Street / reference<input id="fStreet" placeholder="e.g. Santa Rosaweg / Lus trafico Mac Donalds"></label>
    <label>License plate<input id="fPlate" placeholder="e.g. 29-42W"></label>
    <label>Insurance<select id="fIns"><option>New India</option><option>CASH</option><option>VIP Member</option></select></label>
    <label class="full">Comments<textarea id="fNote" rows="2"></textarea></label>
  </div>
  <div class="row"><button class="btn ghost" id="mCancel">Cancel</button><button class="btn red" id="mSave">Create incident</button></div>
</div></div>
<div class="toast" id="toast"></div>

<script>
// ---------- demo data (replaced by Axxon GPS + database later) ----------
const AGENTS=[
 {id:115,name:"Agent 115",van:"H8-43",lat:12.1180,lng:-68.9330},
 {id:121,name:"Unick-Zairo Thom",van:"U16-22",lat:12.1350,lng:-68.9050},
 {id:123,name:"Javan Thomas",van:"U10-22",lat:12.0980,lng:-68.8850},
 {id:130,name:"Jerveney Reineta",van:"U0-69",lat:12.1620,lng:-68.9520},
 {id:137,name:"Darnell Hernandez",van:"H2-11",lat:12.1050,lng:-68.9150},
 {id:139,name:"Shurney Thom",van:"U4-18",lat:12.1450,lng:-68.8700},
 {id:142,name:"Ackerley Isenia",van:"U7-30",lat:12.2350,lng:-69.0350,off:true},
 {id:146,name:"Quinten Girigorie",van:"U12-05",lat:12.1270,lng:-68.9600},
 {id:152,name:"Ellthwin Bitoria",van:"U9-41",lat:12.0850,lng:-68.8600},
];
AGENTS.forEach(a=>{a.status=a.off?"off":"free";a.job=null});
const STATUS={new:["010 Incident generated","p-new"],disp:["400 Agent dispatched","p-disp"],arr:["410 Agent arrived","p-arr"],polis:["460 Meld Polis","p-polis"],closed:["999 Incident closed","p-closed"]};
let seq=49584, incidents=[], selected=null, picking=false, pickLL=null, arrivals=[];
const now=()=>new Date();
const hhmm=d=>d.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
function km(a,b){const R=6371,t=x=>x*Math.PI/180,dl=t(b.lat-a.lat),dn=t(b.lng-a.lng);const h=Math.sin(dl/2)**2+Math.cos(t(a.lat))*Math.cos(t(b.lat))*Math.sin(dn/2)**2;return 2*R*Math.asin(Math.sqrt(h))}
const eta=d=>Math.max(2,Math.round(d*1.4/40*60+1)); // road factor 1.4, 40 km/h

// ---------- map ----------
const map=L.map('map',{zoomControl:true}).setView([12.16,-68.95],11);
L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png',{attribution:'&copy; OpenStreetMap',maxZoom:19}).addTo(map);
const vanIcon=a=>L.divIcon({className:'',html:`<div class="van ${a.status}">${a.id}</div>`,iconSize:[34,34],iconAnchor:[17,17]});
AGENTS.forEach(a=>{a.m=L.marker([a.lat,a.lng],{icon:vanIcon(a)}).addTo(map).bindTooltip(`${a.id} · ${a.name}<br>Van ${a.van}`)});
const incIcon=L.divIcon({className:'',html:'<div class="incpin"></div>',iconSize:[22,22],iconAnchor:[11,11]});

// ---------- incidents ----------
function addIncident(o){const inc={no:seq++,created:now(),log:[{s:'new',t:now(),d:''}],status:'new',agent:null,...o};
 inc.m=L.marker([inc.lat,inc.lng],{icon:incIcon}).addTo(map).on('click',()=>select(inc.no));incidents.unshift(inc);render();return inc}
function setStatus(inc,s,d=''){inc.status=s;inc.log.push({s,t:now(),d});
 if(s==='closed'){map.removeLayer(inc.m);if(inc.agent){const a=inc.agent;a.status='free';a.job=null;a.m.setIcon(vanIcon(a))}}
 render()}
function dispatch(inc,a){inc.agent=a;a.status='busy';a.job=inc;a.m.setIcon(vanIcon(a));inc.dispAt=now();
 setStatus(inc,'disp',`${a.id} - ${a.name} (van ${a.van})`);toast(`Agent ${a.id} dispatched to #${inc.no}`)}
function nearest(inc){return AGENTS.filter(a=>a.status==='free').map(a=>({a,d:km(a,inc)})).sort((x,y)=>x.d-y.d).slice(0,3)}

// ---------- rendering ----------
function render(){
 const open=incidents.filter(i=>i.status!=='closed');
 sOpen.textContent=open.length;cOpen.textContent=open.length;
 sFree.textContent=AGENTS.filter(a=>a.status==='free').length;sBusy.textContent=AGENTS.filter(a=>a.status==='busy').length;
 sAvg.textContent=arrivals.length?Math.round(arrivals.reduce((s,x)=>s+x,0)/arrivals.length)+' min':'–';
 incList.innerHTML=open.length?open.map(i=>{const mins=Math.floor((now()-i.created)/60000);return `<div class="inc ${selected===i.no?'sel':''}" onclick="select(${i.no})">
  <div class="top"><span class="no">#${i.no}</span><span class="pill ${STATUS[i.status][1]}">${STATUS[i.status][0]}</span></div>
  <div class="loc">${i.street||'Location on map'}</div>
  <div class="meta"><span>${i.type}</span><span>${i.plate||''}</span><span>${i.agent?'Agent '+i.agent.id:'<b style="color:var(--red)">Not dispatched</b>'}</span><span class="timer">⏱ ${mins} min</span></div></div>`}).join(''):'<div class="empty">No open incidents.<br>Click “+ New incident” to start.</div>';
 renderRight()}
function renderRight(){
 const inc=incidents.find(i=>i.no===selected);
 if(!inc){rTitle.textContent='Agents';right.innerHTML=AGENTS.map(a=>`<div class="agent" onclick="goMap(${a.lat},${a.lng})"><div class="av" style="background:${a.status==='free'?'var(--green)':a.status==='busy'?'var(--amber)':'#9ca3af'}">${a.id}</div><div><div class="nm">${a.name}</div><small>Van ${a.van}</small></div><div class="st">${a.status==='free'?'Free':a.status==='busy'?'On job #'+a.job.no:'Checked out'}</div></div>`).join('');return}
 rTitle.textContent='Incident #'+inc.no;
 let h=`<h3>${inc.street||'Location on map'}</h3><span class="pill ${STATUS[inc.status][1]}">${STATUS[inc.status][0]}</span>
 <div class="kv"><span>Type</span><span>${inc.type}</span><span>Source</span><span>${inc.source}</span><span>Plate</span><span>${inc.plate||'—'}</span><span>Insurance</span><span>${inc.ins}</span><span>Agent</span><span>${inc.agent?inc.agent.id+' - '+inc.agent.name:'—'}</span>${inc.note?`<span>Comments</span><span>${inc.note}</span>`:''}</div>`;
 if(inc.status==='new'){const s=nearest(inc);h+=`<div class="sugg"><h4>Nearest free agents</h4>${s.length?s.map(({a,d})=>`<div class="agent"><div class="av" style="background:var(--green)">${a.id}</div><div><div class="nm">${a.name}</div><small>${d.toFixed(1)} km · ~${eta(d)} min</small></div><button class="btn red sm" style="margin-left:auto" onclick="dispatchById(${inc.no},${a.id})">Dispatch</button></div>`).join(''):'<div class="empty">No free agents.</div>'}</div>`}
 h+='<div class="actions">';
 if(inc.status==='disp')h+=`<button class="btn ghost sm" onclick="act(${inc.no},'arr')">Arrived (manual)</button>`;
 if(['disp','arr'].includes(inc.status))h+=`<button class="btn ghost sm" onclick="act(${inc.no},'polis')">Meld Polis</button>`;
 if(inc.status!=='closed')h+=`<button class="btn red sm" onclick="act(${inc.no},'closed')">Close incident</button>`;
 h+=`<button class="btn ghost sm" onclick="select(null)">Back to agents</button></div><div class="tl">`+inc.log.map(l=>`<div>${STATUS[l.s][0]}${l.d?' · '+l.d:''}<small>${hhmm(l.t)}</small></div>`).join('')+'</div>';
 right.innerHTML=h}
window.select=no=>{selected=no;const inc=incidents.find(i=>i.no===no);if(inc)map.flyTo([inc.lat,inc.lng],14);render()};
window.dispatchById=(no,id)=>dispatch(incidents.find(i=>i.no===no),AGENTS.find(a=>a.id===id));
window.act=(no,s)=>{const inc=incidents.find(i=>i.no===no);if(s==='arr')arrive(inc,'manual');else setStatus(inc,s);if(s==='closed'){toast(`#${no} closed`);selected=null;render()}};
function arrive(inc,how){const mins=Math.max(1,Math.round((now()-inc.dispAt)/60000));arrivals.push(mins);setStatus(inc,'arr',how==='gps'?`Auto (GPS) · ${mins} min after dispatch`:'Manual');if(how==='gps')toast(`GPS: agent ${inc.agent.id} arrived at #${inc.no}`)}

// ---------- simulated GPS: busy vans drive to their incident, free vans drift ----------
setInterval(()=>{AGENTS.forEach(a=>{
 if(a.status==='busy'&&a.job&&a.job.status==='disp'){const t=a.job,d=km(a,t);if(d<0.15){a.lat=t.lat;a.lng=t.lng;arrive(t,'gps')}else{const f=Math.min(1,0.35/d);a.lat+=(t.lat-a.lat)*f;a.lng+=(t.lng-a.lng)*f}}
 else if(a.status==='free'){a.lat+=(Math.random()-.5)*.0015;a.lng+=(Math.random()-.5)*.0015}
 a.m.setLatLng([a.lat,a.lng])});render()},2000);

// ---------- new incident flow ----------
newBtn.onclick=()=>{picking=true;maptip.style.display='block';map.getContainer().style.cursor='crosshair'};
map.on('click',e=>{if(!picking)return;picking=false;maptip.style.display='none';map.getContainer().style.cursor='';pickLL=e.latlng;mLoc.textContent=`Location: ${e.latlng.lat.toFixed(4)}, ${e.latlng.lng.toFixed(4)}`;modal.classList.add('on');fStreet.focus()});
mCancel.onclick=()=>modal.classList.remove('on');
mSave.onclick=()=>{const inc=addIncident({lat:pickLL.lat,lng:pickLL.lng,type:fType.value,source:fSource.value,street:fStreet.value.trim(),plate:fPlate.value.trim(),ins:fIns.value,note:fNote.value.trim()});modal.classList.remove('on');['fStreet','fPlate','fNote'].forEach(id=>window[id].value='');select(inc.no);toast(`Incident #${inc.no} created — pick an agent`)};
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),2600)}
setInterval(()=>clock.textContent=hhmm(now()),1000);clock.textContent=hhmm(now());

// two sample incidents so the screen isn't empty
addIncident({lat:12.1095,lng:-68.9310,type:'Accident',source:'Involved',street:'Santa Rosaweg / Lus trafico Mac Donalds',plate:'29-42W',ins:'New India',note:''});
const s2=addIncident({lat:12.1400,lng:-68.9000,type:'Accident',source:'Sentral Di Polis',street:'Jongbloedweg / Erosweg',plate:'87-57N',ins:'CASH',note:''});
dispatch(s2,AGENTS.find(a=>a.id===121));selected=null;render();
// ---------- mobile tabs ----------
function isMobile(){return matchMedia('(max-width:820px)').matches}
function showPane(id){document.querySelectorAll('main>section').forEach(x=>x.classList.toggle('show',x.id===id));document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.p===id));if(id==='pMap')setTimeout(()=>map.invalidateSize(),50)}
function goMap(lat,lng){if(isMobile())showPane('pMap');map.flyTo([lat,lng],14)}
document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>showPane(b.dataset.p));
const _select=window.select;window.select=no=>{_select(no);if(isMobile()&&no!=null)showPane('pRight');document.getElementById('tRight').textContent=no!=null?'Incident':'Agents'};
const _new=newBtn.onclick;newBtn.onclick=()=>{if(isMobile())showPane('pMap');_new()};
addEventListener('resize',()=>map.invalidateSize());
</script>
